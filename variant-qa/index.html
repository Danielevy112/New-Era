<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Experiment QA — Variant</title>
<meta name="theme-color" content="#7c5cff" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='white' font-family='system-ui,-apple-system,sans-serif' font-size='28' font-weight='800' letter-spacing='-1'%3EQA%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%237c5cff'/%3E%3Ctext x='90' y='122' text-anchor='middle' fill='white' font-family='system-ui,-apple-system,sans-serif' font-size='78' font-weight='800' letter-spacing='-2'%3EQA%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b0d12;
    --bg-2:#11141c;
    --card:#161a24;
    --border:#262b38;
    --text:#eef1f7;
    --muted:#8a92a4;
    --accent:#7c5cff;
    --accent-2:#5b3df2;
    --yes:#22c55e;
    --no:#ef4444;
    --skip:#64748b;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;height:100dvh;height:100vh;width:100vw}
  body{display:flex;flex-direction:column;background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.15), transparent),
    radial-gradient(800px 600px at -10% 110%, rgba(34,197,94,.08), transparent),
    var(--bg)
  }

  .top{position:relative;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .top .brand{font-weight:600;font-size:14px;letter-spacing:.02em}
  .top .brand span{opacity:.6;font-weight:400}
  .progress{flex:1;height:3px;background:#1c2030;border-radius:999px;overflow:hidden;margin:0 6px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),#9d83ff);width:0;transition:width .3s cubic-bezier(.2,.8,.2,1)}
  .count{font-size:12px;color:var(--muted);min-width:54px;text-align:right;font-variant-numeric:tabular-nums}

  .stage{flex:1;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 24px 40px;
    opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .3s ease, transform .35s cubic-bezier(.2,.8,.2,1)}
  .slide.active{opacity:1;transform:translateX(0);pointer-events:auto}

  .qnum{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  .qnum span{color:var(--accent)}
  .question{font-size:clamp(22px, 4.2vw, 34px);font-weight:600;text-align:center;max-width:680px;line-height:1.25;margin:0 0 10px}
  .helper{color:var(--muted);font-size:14px;text-align:center;max-width:560px;margin:0 0 28px}

  .input{width:min(560px,100%);padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg-2);
    color:var(--text);font:16px/1.4 inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
  textarea.input{min-height:120px;resize:vertical}

  .yn{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:min(560px,100%)}
  .yn button{flex:1;min-width:130px;padding:18px 22px;border-radius:14px;font:600 17px inherit;cursor:pointer;
    border:1px solid var(--border);background:var(--bg-2);color:var(--text);
    transition:transform .12s, background .15s, border-color .15s, box-shadow .15s;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .yn button .kbd{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.06em}
  .yn button:hover{transform:translateY(-1px)}
  .yn button:active{transform:translateY(0)}

  .picks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(620px,100%);margin-bottom:18px}
  .pick{padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg-2);cursor:pointer;font-size:14px}
  .pick.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .primary{margin-top:8px;padding:14px 26px;border-radius:14px;border:0;background:linear-gradient(180deg,var(--accent),var(--accent-2));
    color:#fff;font:600 16px inherit;cursor:pointer;box-shadow:0 8px 24px rgba(124,92,255,.35)}
  .primary:hover{filter:brightness(1.06)}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:12px 22px;border-radius:12px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}

  .nav{padding:14px 18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
  .nav .left,.nav .right{display:flex;gap:10px;align-items:center}
  .nav button{background:transparent;border:0;color:var(--muted);font:14px inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
  .nav button:hover:not(:disabled){color:var(--text);background:#1c2030}
  .nav button:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted)}

  .badge{display:inline-block;padding:6px 14px;border-radius:999px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.3);margin-bottom:16px}

  /* Checklist screens — grouped yes/no rows */
  .cl-title{font-size:clamp(20px,3.4vw,28px);margin-bottom:6px}
  .cl-list{width:min(680px,100%);display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto;padding:2px}
  .cl-row{display:flex;flex-direction:column;gap:8px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:11px 14px;text-align:left}
  .cl-row.bad{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06)}
  .cl-main{display:flex;align-items:center;gap:14px}
  .cl-main .cl-text{flex:1;min-width:0}
  .cl-label{font-size:14px;font-weight:500;line-height:1.35}
  .cl-helper{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .cl-btns{display:flex;gap:6px;flex-shrink:0}
  .cl-btns button{padding:8px 13px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);
    font:600 12.5px inherit;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .cl-btns button:hover{color:var(--text)}
  .cl-btns button.y.sel{background:rgba(34,197,94,.18);border-color:var(--yes);color:#86efac}
  .cl-btns button.n.sel{background:rgba(239,68,68,.18);border-color:var(--no);color:#fca5a5}
  .cl-btns button.s.sel{background:rgba(100,116,139,.22);border-color:var(--skip);color:#cbd5e1}
  .cl-extra{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);
    color:var(--text);font:13px inherit;outline:none}
  .cl-extra:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
  .cl-extra.note{border-color:rgba(239,68,68,.4)}
  .cl-extra.note:focus{border-color:var(--no);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
  @media (max-width:560px){
    .cl-main{flex-direction:column;align-items:stretch;gap:8px}
    .cl-btns{justify-content:flex-end}
    .cl-btns button{flex:1}
  }

  .summary-box{width:min(620px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;
    max-height:38vh;overflow:auto;font:13px/1.55 ui-monospace,"SF Mono",monospace;white-space:pre-wrap;text-align:left}
  .verdict{width:min(620px,100%);border-radius:12px;padding:12px 16px;font-weight:600;margin-bottom:14px;text-align:center;font-size:15px}
  .verdict.pass{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#86efac}
  .verdict.issues{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}

  .toast{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13px;display:none;width:min(620px,100%);text-align:center}
  .toast.ok{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
  .toast.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}

  .config-banner{padding:10px 14px;background:rgba(245,158,11,.1);border-bottom:1px solid rgba(245,158,11,.3);color:#fcd34d;font-size:12px;text-align:center;flex-shrink:0;display:none}
  .config-banner.show{display:block}

  /* Searchable select (combobox) */
  .ss-wrap{width:min(560px,100%);position:relative}
  .ss-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);
    border-radius:12px;max-height:260px;overflow-y:auto;z-index:10;box-shadow:0 12px 28px rgba(0,0,0,.35)}
  .ss-results.hidden{display:none}
  .ss-option{padding:11px 14px;cursor:pointer;border-bottom:1px solid #1c2030;font-size:14px;color:var(--text)}
  .ss-option:last-child{border-bottom:none}
  .ss-option:hover,.ss-option.highlight{background:rgba(124,92,255,.18)}
  .ss-option mark{background:rgba(124,92,255,.4);color:#fff;padding:0 2px;border-radius:3px}
  .ss-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}

  /* Auth gate */
  .auth-gate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent),
      radial-gradient(800px 600px at -10% 110%, rgba(34,197,94,.08), transparent),
      var(--bg)}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 32px;text-align:center;max-width:420px;width:100%}
  .auth-brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .auth-title{font-size:28px;font-weight:600;margin:0 0 10px}
  .auth-helper{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.5}
  .auth-helper b{color:var(--text)}
  #googleBtn{display:flex;justify-content:center;margin-bottom:12px;min-height:40px}
  .auth-error{color:#fca5a5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
    border-radius:10px;padding:10px 14px;font-size:13px;margin:14px 0 0;text-align:left}
  .auth-foot{color:var(--muted);font-size:11px;margin-top:24px}

  .user-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:6px}
  .user-chip img{width:18px;height:18px;border-radius:50%}
  .user-chip .signout{color:var(--muted);cursor:pointer;font-size:11px;text-decoration:underline;background:none;border:0;padding:0 0 0 4px}
  .user-chip .signout:hover{color:var(--text)}

  @media (max-width:560px){
    .question{font-size:24px}
    .yn button{padding:16px 18px;font-size:16px}
    .yn button .kbd{display:none}
    .user-chip span:not(.signout){display:none}
  }
</style>
</head>
<body>

<!-- Google Sign-In gate -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-brand">Variant</div>
    <h1 class="auth-title">Experiment QA</h1>
    <p class="auth-helper">Sign in with your <b>@variantnow.com</b> account to run a QA check.</p>
    <div id="googleBtn"></div>
    <p id="authError" class="auth-error" style="display:none"></p>
    <p class="auth-foot">Restricted to variantnow.com Google Workspace accounts.</p>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<div class="config-banner" id="configBanner">⚠ Apps Script endpoint not configured — submissions will be download-only. Edit <code>ENDPOINT</code> in the HTML source.</div>

<div class="top">
  <div class="brand">Variant <span>/ Experiment QA</span></div>
  <div class="user-chip" id="userChip" style="display:none"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="count" id="count">0 / 0</div>
</div>

<div class="stage" id="stage"></div>

<div class="nav">
  <div class="left">
    <button id="back">← Back</button>
  </div>
  <div class="right">
    <span class="hint" id="hint"></span>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
/* Paste your Apps Script web-app URL here after deploying. Leave empty to disable Monday submission. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzzU7jYOjjZekjj7_zrRnJZdmPLmCBgg2Y-ida-vxeV6KTeKTFvp8bfV5gDS9RgDY0G/exec";

/* Google Sign-In — paste the OAuth Client ID from Google Cloud Console. Leave empty to disable the auth gate. */
const GOOGLE_CLIENT_ID = "1026914799563-rlaav4kmlr01fi1sfa9do1qj0dj89ls2.apps.googleusercontent.com";
const ALLOWED_DOMAIN = "variantnow.com";

const DRAFT_KEY = "variantqa_draft_v3";

/* ========== DATA ========== */
const CLIENTS = ["1Item","Aetrex","AI Store Builder","Allermi","Asufa","BlazePod","Cotton Club","DailySale","DermStreet","Equip","Eric Javits","Eric Kavelaars","F&D Online Marketing Solutions","FootLocker Israel","HAVN","House of Noa","Karma and Luck","Keep Your Cadence","Laundry Sauce","Liquid+","Made Hoops","Mayven","Mega Sports","Milky Mama","Modibodi","Newton Baby, Inc.","Nutrition Faktory","Oral Essentials","Purity Cosmetics","renuar","Rutsu Barefoot","Saalt","Shilav","TempraMed","Terijon","Terra Kaffe","TRX Training","twentyfourseven","VantPanels","Viblo.ai","Yon-Ka","Zendrop"];
const CSMS = ["Daniel Levy","Bar Karako","Ben Segal","Izzy Schack","Ilan Kogan"];

/* Client list is baked in (daily HubSpot sync rewrites it) but can also be refreshed
   live from HubSpot via the Apps Script. Mutate CLIENTS in place so the flow's option
   reference stays valid; cache the last fetch so it survives reloads. */
const CLIENTS_KEY = "variantqa_clients";
function setClients(list){
  const clean = (list||[]).filter(Boolean);
  if(!clean.length) return;
  CLIENTS.length = 0; clean.forEach(c=>CLIENTS.push(c));
}
try{ const _cc = JSON.parse(localStorage.getItem(CLIENTS_KEY)||"null"); if(Array.isArray(_cc)) setClients(_cc); }catch(e){}

/* Stored page values stay compatible with the Monday board; PAGE_LABELS is display-only. */
const PAGES = ["Home","Product","Collection","Menu","Cart","All over","Pop-up","Other"];
const PAGE_LABELS = {"Menu":"Menu / Nav"};

/* ========== CHECK DEFINITIONS ==========
   Universal + post-launch ids match the Monday board column keys (variantConfig, atc, …)
   so the board keeps filling even before the Apps Script is redeployed.
   evidence:true => when answered Yes, ask for a quick proof (order # / confirmation).      */

const UNIVERSAL = [
  {id:"variantConfig", label:"Variant platform config is correct", helper:"Right device, right pages, right audience targeting."},
  {id:"overrideHeader", label:"Header, menu, cart, search & other UI intact", helper:"The experiment doesn't cover, push, or break any of them."},
  {id:"atc", label:"Add to Cart works", helper:"Item lands in the cart / drawer immediately."},
  {id:"checkout", label:"Cart → Checkout works"},
  {id:"refresh5",
    label: a => a.type==="Experience" ? "Refresh a few times — loads cleanly, no flicker" : "Refresh a few times — same variant, no flicker",
    helper: a => a.type==="Experience" ? "Keeps rendering correctly; no flash of the old page before it loads." : "Keeps rendering; doesn't flip between control and variant."},
  {id:"clickDest", label:"Every element the test touches leads to the right place"},
  {id:"consoleErrors", label:"Browser console is clean — no new JavaScript errors", helper:"Open DevTools console — the experiment shouldn't throw anything new."},
];

// Sitewide device sanity — asked once for each device the test runs on.
const DEVICE_MOBILE = [
  {id:"dm_safari", label:"Checked on real iOS Safari — not just Chrome DevTools", helper:"Safari renders sticky bars, drawers & 100vh height differently; most mobile traffic is iOS."},
  {id:"dm_hscroll", label:"Pages fit the screen width — no sideways scroll"},
  {id:"dm_targets", label:"Tap targets are big enough and well spaced"},
  {id:"dm_sticky", label:"Sticky / fixed elements stay put as the address bar hides & shows"},
  {id:"dm_keyboard", label:"Fields stay visible above the on-screen keyboard", helper:"Search, promo code, pop-up & checkout inputs."},
];
const DEVICE_DESKTOP = [
  {id:"dd_hover", label:"Hover states work — menus, product cards, tooltips, buttons"},
  {id:"dd_widths", label:"Looks right across widths — resize from ~1024 up to 1440+", helper:"No overlap, stretching, or broken columns at laptop / wide / small-desktop."},
  {id:"dd_focus", label:"Keyboard tab order works and focus outlines are visible"},
];

const PAGE_DEFS = [
  {page:"Home", icon:"🏠", key:"home", items:[
    {k:"header", label:"Header, announcement bar & sticky-on-scroll behavior intact"},
    {k:"search", label:"Search opens; predictive dropdown sits above content"},
    {k:"hero", label:"Hero + its CTAs load and lead to the right place"},
    {k:"carousels", label:"Carousels / sliders work (swipe / arrows); autoplay & video ok"},
    {k:"tiles", label:"Category tiles & promo banners → the right collections"},
    {k:"featured", label:"Featured-product cards render; quick-add & reviews / social-proof widgets load", helper:"N/A anything the page doesn't have."},
    {k:"footer", label:"Footer intact; newsletter signup submits"},
    {k:"layout", label:"Page holds together — fits the screen, stays put on load, hero/CTA above the fold"},
  ]},
  {page:"Product", icon:"🛍", key:"prod", items:[
    {k:"variants", label:"Variant switching consistent — image, price (incl. sale) & stock update"},
    {k:"soldOut", label:"Sold-out product / variant shows correctly; ATC disabled"},
    {k:"atc", label:"ATC → drawer immediately; quantity, remove & re-add the same product work"},
    {k:"sticky", label:"Sticky / floating ATC bar works and stays clear of content", helper:"N/A if there's no sticky ATC."},
    {k:"express", label:"Express-checkout buttons (Shop Pay / Apple Pay / PayPal) render & work", helper:"N/A if none."},
    {k:"upsells", label:"Upsells / recommended / recently-viewed can be added"},
    {k:"gallery", label:"Image gallery swipes (mobile) / zooms (desktop) correctly"},
    {k:"extras", label:"Accordions, size guide, reviews & subscription option all work", helper:"N/A anything not present."},
  ]},
  {page:"Collection", icon:"🗂", key:"col", items:[
    {k:"filterUI", label:"Filter UI works — sidebar (desktop) / drawer (mobile) opens, applies & clears"},
    {k:"sort", label:"Sort works and holds after pagination"},
    {k:"count", label:"Result count & applied-filter chips are accurate"},
    {k:"pagination", label:"Pagination / load-more / infinite scroll works"},
    {k:"cards", label:"Cards ok — image, price, swatches swap image (hover / tap), sold-out badge"},
    {k:"noResults", label:"An empty filter combination shows a proper 'no results' state"},
    {k:"quickView", label:"Quick-view / quick-add works: opens, variants + ATC", helper:"N/A if none."},
    {k:"header", label:"Collection header / banner / description & breadcrumbs render"},
  ]},
  {page:"Menu", icon:"📂", key:"menu", items:[
    {k:"open", label:"Opens & closes cleanly (tap hamburger / hover-click header)"},
    {k:"onTop", label:"Stays above page content; background scroll locks", helper:"Scroll-lock mainly matters on mobile / full-screen menus."},
    {k:"links", label:"All top-level links go to the right place"},
    {k:"submenus", label:"Sub-menus / mega-menu expand and are usable", helper:"N/A if there are none."},
    {k:"icons", label:"Search / account / cart icons inside still work", helper:"N/A if not present."},
    {k:"fit", label:"Fits the viewport; scrolls if items overflow"},
  ]},
  {page:"Cart", icon:"🛒", key:"cart", items:[
    {k:"lineItems", label:"Line items render (image / variant / price / qty); remove & qty update totals"},
    {k:"totals", label:"Subtotal / shipping / tax / total correct; currency formatting right"},
    {k:"promo",
      label: a => a.type==="Experience" ? "Promo / discount code applies correctly" : "Promo code applies on control AND every variant",
      helper: a => a.type==="Experience" ? "Apply a valid code — discount + totals update. An invalid code errors gracefully." : "Repeat on Variant 1, 2… An invalid code errors gracefully."},
    {k:"shipBar", label:"Free-shipping progress bar accurate", helper:"N/A if the site has none."},
    {k:"express", label:"Express-checkout buttons (Shop Pay / Apple Pay / PayPal) work", helper:"N/A if none."},
    {k:"empty", label:"Empty-cart state renders; cart persists across pages & refresh"},
    {k:"drawer", label:"Drawer / mini-cart opens & closes cleanly; upsell / notes work if present"},
  ]},
  {page:"All over", icon:"🌐", key:"ao", items:[
    {k:"shows", label:"Shows on every page it should (Home, PLP, PDP, Cart)"},
    {k:"layout", label:"Underlying page layouts stay intact everywhere"},
    {k:"dismiss", label:"Dismiss works & stays dismissed across navigation", helper:"N/A if it has no close."},
    {k:"zindex", label:"Above content but below header / menu / cart drawer"},
    {k:"cta", label:"Clicking it goes to the right place", helper:"N/A if not clickable."},
  ]},
  {page:"Pop-up", icon:"🎯", key:"pop", items:[
    {k:"trigger", label:"Triggers correctly (delay / scroll / exit-intent) on the right device"},
    {k:"close", label:"Close / X works and it stays closed for the session"},
    {k:"conflict", label:"Plays nicely with existing pop-ups (Klaviyo etc.) & the cookie banner"},
    {k:"form", label:"Form validates & submits; success state shows", helper:"N/A if there's no form."},
    {k:"scrollLock", label:"Background scroll locks while open; focus stays inside"},
    {k:"block", label:"Leaves ATC / checkout clickable; sits at the right z-index"},
  ]},
  {page:"Other", icon:"✍️", key:"oth", noDevice:true, items:[
    {k:"works", label:"Works end-to-end as specced"},
    {k:"responsive", label:"Renders correctly on the devices it targets"},
    {k:"break", label:"Surrounding UI / other elements stay intact"},
  ]},
];

const POST_LAUNCH = [
  {id:"debug1",
    label: a => a.type==="Experience" ? "Previewed the experience before deploying to 100%" : "Verified live with ?debug=1",
    helper: a => a.type==="Experience" ? "Confirm it looked right in preview / QA mode before it went to everyone." : ""},
  {id:"organic",
    label: a => a.type==="Experience" ? "Renders correctly for a normal visitor" : "Renders correctly without ?debug=1"},
  {id:"liveAtcCheckout", label:"Re-tested Add to Cart + Checkout on the live test"},
  {id:"notified",
    label: a => a.type==="Experience" ? "Client notified that the experience is live" : "Client notified that the test is live"},
];

// Flat list of every check id in the wizard — used for the verdict.
const ALL_CHECK_IDS = (() => {
  const ids = UNIVERSAL.map(i => i.id);
  DEVICE_MOBILE.forEach(i => ids.push(i.id));
  DEVICE_DESKTOP.forEach(i => ids.push(i.id));
  PAGE_DEFS.forEach(def => {
    const devs = def.noDevice ? [null] : (def.mobileOnly ? ["m"] : ["m","d"]);
    devs.forEach(dev => def.items.forEach(it => ids.push(pageItemId(def, dev, it.k))));
  });
  POST_LAUNCH.forEach(i => ids.push(i.id));
  return ids;
})();

/* ========== FLOW ========== */
function pageItemId(def, dev, k){ return def.noDevice ? `${def.key}_${k}` : `${def.key}_${dev}_${k}`; }
const isPre  = s => s.mode === "prelaunch";
const isPost = s => s.mode === "postlaunch";

function pageSlide(def, dev){
  const devName = dev === "m" ? "📱 Mobile" : "🖥 Desktop";
  const title = def.noDevice
    ? `${def.icon} ${PAGE_LABELS[def.page] || def.page}`
    : `${def.icon} ${PAGE_LABELS[def.page] || def.page} — ${devName}`;
  return {
    type:"checklist", badge:"Page check", title,
    items: def.items.map(it => ({ id: pageItemId(def, dev, it.k), label: it.label, helper: it.helper })),
    showIf: s => isPre(s) && (s.pages || []).includes(def.page) &&
      (def.noDevice || (dev === "m"
        ? ["Mobile","Both"].includes(s.runsOn)
        : ["Desktop","Both"].includes(s.runsOn))),
  };
}

const pageSlides = [];
PAGE_DEFS.forEach(def => {
  if (def.noDevice) { pageSlides.push(pageSlide(def, null)); return; }
  pageSlides.push(pageSlide(def, "m"));
  if (!def.mobileOnly) pageSlides.push(pageSlide(def, "d"));
});

const flow = [
  {type:"intro"},                        // sets type (Experiment / Experience)
  {type:"select", id:"csm", q:"Who's running this QA?", options:CSMS},
  {type:"select", id:"client", q:"Which client is this test for?", options:CLIENTS},  // add refresh:true to show the HubSpot refresh button (needs HUBSPOT_TOKEN in Apps Script)
  {type:"text", id:"experimentId", q:"What's the Experiment / Experience ID?",
    helper:"ID from Variant's platform.",
    placeholder:"ID from Variant's platform"},
  {type:"choice", id:"runsOn", q:"Where does the test run?", options:["Mobile","Desktop","Both"], showIf:isPre},
  {type:"multi", id:"pages", q:"Which pages does the test touch?", options:PAGES, labels:PAGE_LABELS, required:true, showIf:isPre},
  {type:"text", id:"otherDesc", q:"What does the test touch?", helper:"You picked “Other” — describe it in a few words.", placeholder:"e.g. search results page, blog, account area",
    showIf: s => isPre(s) && (s.pages || []).includes("Other")},
  {type:"checklist", badge:"Every test", title:"✅ The essentials",
    helper:"These apply to every experiment, on the device(s) it runs on.", items:UNIVERSAL, showIf:isPre},
  {type:"checklist", badge:"Device", title:"📱 Mobile-specific",
    helper:"Sitewide mobile sanity — the things that only break on phones.", items:DEVICE_MOBILE,
    showIf:s=>isPre(s) && ["Mobile","Both"].includes(s.runsOn)},
  {type:"checklist", badge:"Device", title:"🖥 Desktop-specific",
    helper:"Sitewide desktop sanity — hover, widths, keyboard.", items:DEVICE_DESKTOP,
    showIf:s=>isPre(s) && ["Desktop","Both"].includes(s.runsOn)},

  ...pageSlides,

  {type:"checklist", badge:"Post-launch", title:"🚀 After launch", items:POST_LAUNCH,
    helper:"Confirm the live experience once the test is published — mark N/A if you're still pre-launch."},

  {type:"longtext", id:"notes", q:"Anything else worth noting?",
    helper:"Optional — edge cases, follow-ups, or anything that stood out during QA.",
    optional:true},
  {type:"summary"}
];

const state = {answers:{mode:"prelaunch"}, idx:0, user:null, timing:{startedAt:null, submittedAt:null}, _focusInput:null};

function visible(){
  return flow.filter(s => {
    if (s.id === "csm" && state.user) return false;   // skip CSM picker when signed in
    return !s.showIf || s.showIf(state.answers);
  });
}
function currentSlide(){ return visible()[state.idx]; }
function resolve(v){ return typeof v === "function" ? v(state.answers) : v; }

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const count = document.getElementById("count");
const back = document.getElementById("back");
const hint = document.getElementById("hint");
const banner = document.getElementById("configBanner");
if(!ENDPOINT) banner.classList.add("show");

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- draft persistence ---------- */
function saveDraft(){
  try{
    // don't persist an untouched intro
    if(state.idx === 0 && Object.keys(state.answers).length <= 1) return;
    localStorage.setItem(DRAFT_KEY, JSON.stringify({answers:state.answers, idx:state.idx, timing:state.timing, ts:Date.now()}));
  }catch(e){}
}
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); }catch(e){ return null; } }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

/* ---------- verdict ---------- */
function verdict(){
  const a = state.answers;
  const answered = ALL_CHECK_IDS.filter(id => a[id]);
  const fails = answered.filter(id => a[id] === "No");
  return { passed: fails.length === 0, answeredCount: answered.length, failCount: fails.length, failIds: fails };
}

/* ---------- checklist completeness (all answered; every No has a comment) ---------- */
function checklistComplete(s){
  return s.items.every(it => {
    const ans = state.answers[it.id];
    if(!ans) return false;
    if(ans === "No") return (state.answers[it.id + "__note"] || "").trim().length > 0;
    return true;
  });
}

function render(){
  const vis = visible();
  if(state.idx > vis.length - 1) state.idx = vis.length - 1;
  const s = vis[state.idx];
  const total = vis.length;
  bar.style.width = `${(state.idx/(total-1))*100}%`;
  count.textContent = `${state.idx+1} / ${total}`;
  back.disabled = state.idx === 0;
  saveDraft();

  let html = "";
  const num = ["intro","summary","checklist"].includes(s.type) ? "" :
    `<div class="qnum">Q<span>${state.idx}</span></div>`;

  if(s.type === "intro"){
    const draft = loadDraft();
    const hasDraft = draft && draft.answers && (draft.answers.client || draft.answers.experimentId);
    const resumeLabel = hasDraft
      ? `Resume: ${escapeHtml(draft.answers.client||"?")} — ${escapeHtml(draft.answers.experimentId||"?")} →`
      : "";
    html = `
      <div class="slide active">
        <div class="badge">Variant CSM</div>
        <h1 class="question">Experiment &amp; Experience QA</h1>
        <p class="helper">One quick pass — 2 to 3 minutes. What are you QA-ing?</p>
        <div class="yn" style="max-width:560px">
          <button data-type="Experiment">🧪 Experiment<span class="kbd">A/B split — control + variants</span></button>
          <button data-type="Experience">✨ Experience<span class="kbd">shipped to 100% of users</span></button>
        </div>
        ${hasDraft ? `<div style="height:14px"></div><button class="ghost" data-resume>${resumeLabel}</button>` : ""}
      </div>`;
  } else if(s.type === "checklist"){
    html = `
      <div class="slide active">
        <div class="badge">${escapeHtml(s.badge||"Checks")}</div>
        <h1 class="question cl-title">${escapeHtml(s.title)}</h1>
        ${s.helper?`<p class="helper" style="margin-bottom:16px">${escapeHtml(resolve(s.helper))}</p>`:""}
        <div class="cl-list">
          ${s.items.map(it=>{
            const ans = state.answers[it.id];
            const lbl = resolve(it.label);
            const hlp = resolve(it.helper);
            let extra = "";
            if(ans === "No"){
              const v = state.answers[it.id+"__note"] || "";
              extra = `<input class="cl-extra note" data-noteid="${escapeHtml(it.id)}" placeholder="What broke? (required)" value="${escapeHtml(v)}">`;
            } else if(ans === "Yes" && it.evidence){
              const v = state.answers[it.id+"__evidence"] || "";
              extra = `<input class="cl-extra" data-evid="${escapeHtml(it.id)}" placeholder="${escapeHtml(it.evidenceLabel||"Proof / detail (optional)")}" value="${escapeHtml(v)}">`;
            }
            return `
            <div class="cl-row ${ans==="No"?"bad":""}">
              <div class="cl-main">
                <div class="cl-text">
                  <div class="cl-label">${escapeHtml(lbl)}</div>
                  ${hlp?`<div class="cl-helper">${escapeHtml(hlp)}</div>`:""}
                </div>
                <div class="cl-btns">
                  ${["Yes","No","N/A"].map(v=>{
                    const cls = v==="Yes"?"y":v==="No"?"n":"s";
                    const sel = ans===v ? " sel" : "";
                    return `<button class="${cls}${sel}" data-clid="${escapeHtml(it.id)}" data-v="${v}">${v}</button>`;
                  }).join("")}
                </div>
              </div>
              ${extra}
            </div>`;
          }).join("")}
        </div>
        <button class="primary" data-next id="clNext" ${checklistComplete(s)?"":"disabled"}>Continue →</button>
      </div>`;
  } else if(s.type === "text"){
    const v = state.answers[s.id] || "";
    html = `
      <div class="slide active">
        ${num}
        <h1 class="question">${escapeHtml(resolve(s.q))}</h1>
        ${s.helper?`<p class="helper">${escapeHtml(resolve(s.helper))}</p>`:""}
        <input class="input" id="inp" placeholder="${escapeHtml(s.placeholder||"")}" value="${escapeHtml(v)}" autocomplete="off">
        <div style="height:18px"></div>
        <button class="primary" data-next>OK →</button>
      </div>`;
  } else if(s.type === "longtext"){
    const v = state.answers[s.id] || "";
    html = `
      <div class="slide active">
        ${num}
        <h1 class="question">${escapeHtml(resolve(s.q))}</h1>
        ${s.helper?`<p class="helper">${escapeHtml(resolve(s.helper))}</p>`:""}
        <textarea class="input" id="inp" placeholder="Optional...">${escapeHtml(v)}</textarea>
        <div style="height:18px"></div>
        <button class="primary" data-next>${s.optional?"Done →":"OK →"}</button>
      </div>`;
  } else if(s.type === "choice"){
    html = `
      <div class="slide active">
        ${num}
        <h1 class="question">${escapeHtml(resolve(s.q))}</h1>
        ${s.helper?`<p class="helper">${escapeHtml(resolve(s.helper))}</p>`:""}
        <div class="yn">
          ${s.options.map(o=>{
            const label = typeof o==="object" ? o.label : o;
            const val = typeof o==="object" ? o.value : o;
            return `<button data-choice="${escapeHtml(val)}">${escapeHtml(label)}</button>`;
          }).join("")}
        </div>
      </div>`;
  } else if(s.type === "multi"){
    const arr = state.answers[s.id] || [];
    html = `
      <div class="slide active">
        ${num}
        <h1 class="question">${escapeHtml(resolve(s.q))}</h1>
        <p class="helper">Tap all that apply.</p>
        <div class="picks">
          ${s.options.map(o=>`<div class="pick ${arr.includes(o)?"on":""}" data-pick="${escapeHtml(o)}">${escapeHtml((s.labels||{})[o]||o)}</div>`).join("")}
        </div>
        <button class="primary" data-next ${s.required && !arr.length ? "disabled" : ""}>Continue →</button>
      </div>`;
  } else if(s.type === "select"){
    const v = state.answers[s.id] || "";
    html = `
      <div class="slide active">
        ${num}
        <h1 class="question">${escapeHtml(resolve(s.q))}</h1>
        ${s.helper?`<p class="helper">${escapeHtml(resolve(s.helper))}</p>`:""}
        <div class="ss-wrap">
          <input class="input" id="inp" placeholder="Type to search… (${s.options.length} options)" value="${escapeHtml(v)}" autocomplete="off">
          <div id="ssResults" class="ss-results hidden"></div>
        </div>
        ${s.refresh ? `<div style="margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">
          <button class="ghost" id="refreshClients" style="padding:8px 14px;font-size:13px">🔄 Refresh clients from HubSpot</button>
          <span id="clientRefreshStatus" class="hint"></span>
        </div>` : ""}
        <div style="height:18px"></div>
        <button class="primary" data-next>OK →</button>
      </div>`;
  } else if(s.type === "summary"){
    bar.style.width = "100%";
    const vd = verdict();
    const sum = renderSummary();
    const submitBtn = ENDPOINT
      ? `<button class="primary" id="submit">${isPost(state.answers)?"Complete post-launch on Monday →":"Submit to Monday board →"}</button>`
      : `<button class="primary" id="copy">Copy summary</button>`;
    html = `
      <div class="slide active">
        <div class="qnum">All done 🎉</div>
        <div class="verdict ${vd.passed?"pass":"issues"}">${vd.passed
          ? "✅ Passed — no issues flagged"
          : `⚠️ Issues found — ${vd.failCount} check${vd.failCount>1?"s":""} marked No`}</div>
        <pre class="summary-box" id="summary">${escapeHtml(sum)}</pre>
        <div class="pill-row">
          ${submitBtn}
          ${ENDPOINT ? `<button class="ghost" id="copy">Copy summary</button>` : ""}
          <button class="ghost" id="restart">Start over</button>
          <a class="ghost" href="https://variantnow-company.monday.com/boards/5088942350" target="_blank">Open Monday board ↗</a>
        </div>
        <div class="toast" id="toast"></div>
      </div>`;
    hint.textContent = "";
  } else {
    html = `<div class="slide active"><p>Unknown slide</p></div>`;
  }

  stage.innerHTML = html;

  // intro type buttons + resume
  stage.querySelectorAll("[data-type]").forEach(b=>b.addEventListener("click", ()=>{
    state.answers.type = b.dataset.type;
    if(!state.timing.startedAt) state.timing.startedAt = Date.now();
    advance();
  }));
  const resumeBtn = stage.querySelector("[data-resume]");
  if(resumeBtn) resumeBtn.addEventListener("click", ()=>{
    const d = loadDraft();
    if(d){
      state.answers = d.answers;
      if(state.user) state.answers.csm = state.user.name;  // keep the signed-in CSM
      state.timing = d.timing || state.timing;
      state.idx = d.idx || 0;
      render();
    }
  });

  stage.querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click", ()=>{ state.answers[s.id] = b.dataset.choice; advance(); }));
  stage.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click", ()=>{
    const arr = state.answers[s.id] || [];
    const v = b.dataset.pick;
    if(arr.includes(v)) state.answers[s.id] = arr.filter(x=>x!==v);
    else state.answers[s.id] = [...arr, v];
    b.classList.toggle("on");
    if(s.required){
      const nb = stage.querySelector("[data-next]");
      if(nb) nb.disabled = !(state.answers[s.id]||[]).length;
    }
    saveDraft();
  }));
  stage.querySelectorAll("[data-clid]").forEach(b=>b.addEventListener("click", ()=>{
    const id = b.dataset.clid, v = b.dataset.v;
    state.answers[id] = v;
    // focus the follow-up input this answer reveals
    const it = s.items.find(i => i.id === id);
    if(v === "No") state._focusInput = {sel:`[data-noteid="${id}"]`};
    else if(v === "Yes" && it && it.evidence) state._focusInput = {sel:`[data-evid="${id}"]`};
    else state._focusInput = null;
    render();
  }));
  // note / evidence inputs — store without re-render (keep focus), update Continue state
  stage.querySelectorAll("[data-noteid]").forEach(el=>el.addEventListener("input", ()=>{
    state.answers[el.dataset.noteid + "__note"] = el.value;
    const nb = stage.querySelector("#clNext");
    if(nb) nb.disabled = !checklistComplete(s);
    saveDraft();
  }));
  stage.querySelectorAll("[data-evid]").forEach(el=>el.addEventListener("input", ()=>{
    state.answers[el.dataset.evid + "__evidence"] = el.value;
    saveDraft();
  }));

  const next = stage.querySelector("[data-next]");
  if(next) next.addEventListener("click", ()=>{
    if(next.disabled) return;
    const inp = stage.querySelector("#inp");
    if(inp) state.answers[s.id] = inp.value.trim();
    advance();
  });

  // focus a revealed note/evidence input if requested
  if(state._focusInput){
    const t = stage.querySelector(state._focusInput.sel);
    if(t){ t.focus(); }
    state._focusInput = null;
  }

  const inp = stage.querySelector("#inp");
  if(inp){
    if(!state._focusInput) inp.focus();
    if(s.type !== "select"){
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); next?.click(); }});
    }
  }
  // Search-select wiring (combobox: typeable + filtered dropdown + keyboard nav)
  if(inp && s.type === "select"){
    const results = stage.querySelector("#ssResults");
    const options = s.options || [];
    let highlightIdx = -1;
    const renderList = (query) => {
      const q = (query||"").trim().toLowerCase();
      const matches = q ? options.filter(o => o.toLowerCase().includes(q)) : options;
      if(!matches.length){
        results.innerHTML = '<div class="ss-empty">No matches</div>';
        results.classList.remove("hidden");
        highlightIdx = -1;
        return;
      }
      highlightIdx = 0;
      results.innerHTML = matches.slice(0, 100).map((o, i) => {
        let display = escapeHtml(o);
        if(q){
          const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          display = display.replace(new RegExp(`(${safe})`, "ig"), "<mark>$1</mark>");
        }
        return `<div class="ss-option${i===0?' highlight':''}" data-value="${escapeHtml(o)}">${display}</div>`;
      }).join("");
      results.classList.remove("hidden");
      results.querySelectorAll("[data-value]").forEach(el => {
        el.addEventListener("mousedown", e => e.preventDefault());
        el.addEventListener("click", () => {
          inp.value = el.dataset.value;
          state.answers[s.id] = el.dataset.value;
          results.classList.add("hidden");
          advance();
        });
      });
    };
    inp.addEventListener("input", () => renderList(inp.value));
    inp.addEventListener("focus", () => renderList(inp.value));
    inp.addEventListener("blur", () => setTimeout(() => results.classList.add("hidden"), 150));
    inp.addEventListener("keydown", e => {
      const opts = results.querySelectorAll(".ss-option");
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        const hl = results.querySelector(".ss-option.highlight");
        if(hl){ hl.click(); }
        else if(options.includes(inp.value.trim())){
          state.answers[s.id] = inp.value.trim();
          advance();
        }
        else if(opts.length){ opts[0].click(); }
        else { next?.click(); }
      } else if(e.key === "ArrowDown" && opts.length){
        e.preventDefault();
        if(highlightIdx >= 0) opts[highlightIdx]?.classList.remove("highlight");
        highlightIdx = (highlightIdx + 1) % opts.length;
        opts[highlightIdx].classList.add("highlight");
        opts[highlightIdx].scrollIntoView({block:"nearest"});
      } else if(e.key === "ArrowUp" && opts.length){
        e.preventDefault();
        if(highlightIdx >= 0) opts[highlightIdx]?.classList.remove("highlight");
        highlightIdx = highlightIdx <= 0 ? opts.length - 1 : highlightIdx - 1;
        opts[highlightIdx].classList.add("highlight");
        opts[highlightIdx].scrollIntoView({block:"nearest"});
      } else if(e.key === "Escape"){
        results.classList.add("hidden");
      }
    });
  }

  const copy = stage.querySelector("#copy");
  if(copy) copy.addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(document.querySelector("#summary").textContent);
      const o = copy.textContent; copy.textContent = "Copied ✓"; setTimeout(()=>copy.textContent=o, 1600);
    }catch{ alert("Couldn't copy — select the text manually."); }
  });
  const restart = stage.querySelector("#restart");
  if(restart) restart.addEventListener("click", ()=>{ if(confirm("Start a fresh QA?")){ clearDraft(); resetState(); render(); } });
  const submit = stage.querySelector("#submit");
  if(submit) submit.addEventListener("click", () => submitToMonday(submit));
  const rc = stage.querySelector("#refreshClients");
  if(rc) rc.addEventListener("click", ()=>refreshClients(false));

  if(s.type==="checklist"){ hint.textContent="Y / N / S fills the next row"; }
  else if(s.type==="text"||s.type==="longtext"||s.type==="select"){ hint.textContent="Enter to continue"; }
  else if(s.type==="choice"){ hint.textContent="Tap to choose"; }
  else if(s.type==="multi"){ hint.textContent="Tap to toggle"; }
  else { hint.textContent=""; }
}

function resetState(){
  const u = state.user;
  state.answers = {mode:"prelaunch"};
  if(u) state.answers.csm = u.name;
  state.idx = 0;
  state.timing = {startedAt:null, submittedAt:null};
  state._focusInput = null;
}

function advance(){
  if(state.idx < visible().length - 1){ state.idx++; render(); }
}

back.addEventListener("click", ()=>{ if(state.idx>0){ state.idx--; render(); }});

document.addEventListener("keydown", e=>{
  const s = currentSlide();
  if(!s) return;
  const tag = (document.activeElement||{}).tagName;
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  if(s.type === "checklist"){
    const map = {y:"Yes", n:"No", s:"N/A"};
    const v = map[e.key.toLowerCase()];
    if(v){
      const it = s.items.find(i => !state.answers[i.id]);
      if(it){
        state.answers[it.id] = v;
        const def = s.items.find(x => x.id === it.id);
        if(v === "No") state._focusInput = {sel:`[data-noteid="${it.id}"]`};
        else if(v === "Yes" && def && def.evidence) state._focusInput = {sel:`[data-evid="${it.id}"]`};
        render();
      }
      return;
    }
    if(e.key === "Enter"){
      const nb = stage.querySelector("#clNext");
      if(nb && !nb.disabled) nb.click();
      return;
    }
  }
  if(e.key === "ArrowLeft" && state.idx>0){ state.idx--; render(); }
});

/* ========== SUMMARY ========== */
function fmtDuration(sec){
  if(!sec || sec < 0) return null;
  const m = Math.floor(sec/60), s = sec%60;
  return m ? `${m}m ${s}s` : `${s}s`;
}
function computeTiming(){
  const started = state.timing.startedAt;
  const ended = state.timing.submittedAt || Date.now();
  const sec = started ? Math.round((ended - started)/1000) : null;
  const vd = verdict();
  // Fast-flag: an honest QA with many rows can't be done in seconds.
  const fast = sec != null && vd.answeredCount >= 6 && sec < vd.answeredCount * 4;
  return { sec, fast };
}

function renderSummary(){
  const a = state.answers;
  const vd = verdict();
  const tim = computeTiming();
  const mark = v => v==="Yes"?"✅":v==="No"?"❌":"➖";
  const lines = [];
  lines.push(vd.passed ? "VERDICT: ✅ Passed" : `VERDICT: ⚠️ Issues found (${vd.failCount})`);
  lines.push(`Type: ${a.type||"—"}`);
  lines.push(`*QA — ${a.client||"—"} / ${a.experimentId||"—"}*`);
  lines.push(`CSM: ${a.csm||"—"}${isPre(a)?`   Device: ${a.runsOn||"—"}`:""}`);
  if(isPre(a)) lines.push(`Pages: ${(a.pages||[]).map(p=>PAGE_LABELS[p]||p).join(", ")||"—"}`);
  if(a.otherDesc) lines.push(`Other: ${a.otherDesc}`);
  const dur = fmtDuration(tim.sec);
  if(dur) lines.push(`Time: ${dur}${tim.fast?"  ⚠ fast — worth a spot-check":""}`);
  lines.push(`Date: ${new Date().toLocaleString()}`);

  const row = (id, label) => {
    if(!a[id]) return null;
    let line = `${mark(a[id])} ${label}`;
    if(a[id]==="No" && a[id+"__note"]) line += `\n   ↳ ${a[id+"__note"]}`;
    if(a[id]==="Yes" && a[id+"__evidence"]) line += `\n   ↳ ${a[id+"__evidence"]}`;
    return line;
  };
  const block = (title, rows) => {
    const filled = rows.filter(Boolean);
    if(filled.length){ lines.push("", `— ${title} —`, ...filled); }
  };

  if(isPre(a)){
    block("✅ Essentials", UNIVERSAL.map(i=>row(i.id, resolve(i.label))));
    block("📱 Mobile-specific", DEVICE_MOBILE.map(i=>row(i.id, resolve(i.label))));
    block("🖥 Desktop-specific", DEVICE_DESKTOP.map(i=>row(i.id, resolve(i.label))));
    PAGE_DEFS.forEach(def=>{
      const rows = [];
      if(def.noDevice){
        def.items.forEach(it=>rows.push(row(pageItemId(def,null,it.k), resolve(it.label))));
      } else {
        [["m","📱"],["d","🖥"]].forEach(([dev,ic])=>{
          def.items.forEach(it=>rows.push(row(pageItemId(def,dev,it.k), `${ic} ${resolve(it.label)}`)));
        });
      }
      block(`${def.icon} ${PAGE_LABELS[def.page]||def.page}`, rows);
    });
  }
  if(isPost(a) || POST_LAUNCH.some(i=>a[i.id])){
    block("🚀 After launch", POST_LAUNCH.map(i=>row(i.id, resolve(i.label))));
  }

  if(a.notes && a.notes.trim()){
    lines.push("", "— Notes —", a.notes.trim());
  }
  return lines.join("\n");
}

async function submitToMonday(btn){
  const toast = document.getElementById("toast");
  toast.className = "toast";
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = "Submitting…";
  // finalize telemetry + derived fields sent to the backend
  state.timing.submittedAt = Date.now();
  const tim = computeTiming();
  const vd = verdict();
  state.answers.test = `${state.answers.client || "?"} — ${state.answers.experimentId || "?"}`;
  state.answers.verdict = vd.passed ? "Passed" : "Issues found";
  state.answers.durationSec = tim.sec;
  state.answers.fast = tim.fast;
  state.answers.recap = renderSummary();  // backend writes this verbatim to Notes + Update
  try{
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },  // avoids CORS preflight on Apps Script
      body: JSON.stringify(state.answers)
    });
    const json = await res.json();
    if(json.ok){
      clearDraft();
      toast.className = "toast ok";
      const verb = json.updated ? "Updated on Monday" : "Created on Monday";
      toast.innerHTML = `${verb} — <a href="${json.url}" target="_blank" style="color:inherit;text-decoration:underline">open item ↗</a>`;
      btn.textContent = json.updated ? "Updated ✓" : "Submitted ✓";
    } else {
      throw new Error(json.error || "Unknown error");
    }
  }catch(e){
    toast.className = "toast err";
    toast.textContent = "Submission failed: " + e.message + ". Use Copy summary as a backup.";
    btn.textContent = orig;
    btn.disabled = false;
  }
}

/* ========== HubSpot client refresh ========== */
let _clientsFetched = false;
async function refreshClients(silent){
  if(!ENDPOINT) return;
  const setStatus = t => { const el = document.getElementById("clientRefreshStatus"); if(el) el.textContent = t; };
  if(!silent) setStatus("Refreshing…");
  try{
    const res = await fetch(`${ENDPOINT}?action=clients&fresh=1`);
    const json = await res.json();
    if(json.ok && Array.isArray(json.clients) && json.clients.length){
      setClients(json.clients);
      try{ localStorage.setItem(CLIENTS_KEY, JSON.stringify(json.clients)); }catch(e){}
      const cur = currentSlide();
      if(cur && cur.id === "client") render();   // re-render rebuilds the status node
      setStatus(`Updated — ${json.clients.length} clients`);
    } else if(!silent){
      setStatus(json.error ? `Couldn't refresh — ${json.error}` : "No update available");
    }
  }catch(e){
    if(!silent) setStatus("Couldn't reach HubSpot");
  }
}
function ensureClients(){ if(_clientsFetched) return; _clientsFetched = true; refreshClients(true); }

/* ========== Google Sign-In gate ========== */
const authGate = document.getElementById("authGate");
const userChip = document.getElementById("userChip");
const authError = document.getElementById("authError");

function showAuthError(msg){
  authError.textContent = msg;
  authError.style.display = "block";
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
}

async function handleCredentialResponse(response){
  authError.style.display = "none";
  try {
    // Verify the ID token against Google's tokeninfo (server-side signature check)
    const r = await fetch(`https://oauth2.googleapis.com/tokeninfo?id_token=${response.credential}`);
    const claims = await r.json();
    if (!r.ok) throw new Error(claims.error_description || "Token verification failed");
    if (claims.aud !== GOOGLE_CLIENT_ID) throw new Error("Token audience mismatch");
    if (String(claims.email_verified) !== "true") throw new Error("Email not verified");
    if (claims.hd !== ALLOWED_DOMAIN) {
      throw new Error(`Only @${ALLOWED_DOMAIN} accounts are allowed. You signed in as ${claims.email}.`);
    }
    // Authorized — store + pre-fill CSM + show wizard
    state.user = { email: claims.email, name: claims.name, picture: claims.picture };
    state.answers.csm = claims.name;
    authGate.style.display = "none";
    userChip.style.display = "flex";
    userChip.innerHTML =
      `<img src="${claims.picture}" alt="">` +
      `<span>${escapeHtml(claims.name)}</span>` +
      `<button class="signout" id="signoutBtn">sign out</button>`;
    document.getElementById("signoutBtn").addEventListener("click", signOut);
    render();
    ensureClients();
  } catch (e) {
    showAuthError(e.message);
  }
}

function signOut(){
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.disableAutoSelect();
  }
  state.user = null;
  resetState();
  state.answers = {mode:"prelaunch"};
  userChip.style.display = "none";
  authGate.style.display = "flex";
}

function initGoogleAuth(){
  if (!GOOGLE_CLIENT_ID) {
    // Auth not configured — skip the gate (dev mode)
    authGate.style.display = "none";
    render();
    ensureClients();
    return;
  }
  if (!(window.google && google.accounts && google.accounts.id)) {
    setTimeout(initGoogleAuth, 100);   // wait for GIS library
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    hd: ALLOWED_DOMAIN,                 // restrict the account picker to variantnow.com
    auto_select: false,
    cancel_on_tap_outside: false,
  });
  google.accounts.id.renderButton(
    document.getElementById("googleBtn"),
    { theme: "filled_blue", size: "large", type: "standard", text: "signin_with", shape: "pill" }
  );
}

window.addEventListener("load", initGoogleAuth);

// Render the first slide BEHIND the auth gate so the wizard is ready once auth completes.
render();
</script>
