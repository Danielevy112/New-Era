<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal</title>
  <style>
    :root { --ink: #1c2330; --muted: #6b7280; --line: #e4e7ec; --accent: #2f4a8a; --soft: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink); background: #eef1f6; font-size: 14px; }
    .bar { max-width: 820px; margin: 0 auto; padding: 14px 8px; display: flex; gap: 10px; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: #fff; padding: 9px 16px; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 14px; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sheet { max-width: 820px; margin: 0 auto 40px; background: #fff; padding: 48px 52px;
      box-shadow: 0 6px 30px rgba(0,0,0,.08); }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
      border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 26px; }
    .logo { max-height: 60px; max-width: 200px; }
    .biz-name { font-size: 22px; font-weight: 800; color: var(--accent); }
    .biz-meta { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.7; }
    .doc-title { text-align: right; }
    .doc-title h1 { margin: 0; font-size: 26px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); }
    .doc-title .num { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .parties { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .parties .box { flex: 1; }
    .parties .lbl { text-transform: uppercase; font-size: 11px; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    .parties .company { font-size: 17px; font-weight: 700; }
    .parties .sub { color: var(--muted); font-size: 13px; line-height: 1.7; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
    thead th { background: var(--soft); text-align: left; padding: 11px 12px; font-size: 11px;
      text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--line); }
    tbody td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .item-img { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
    .item-name { font-weight: 600; }
    .item-desc { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .totals { margin-left: auto; width: 320px; margin-top: 14px; }
    .totals .row { display: flex; justify-content: space-between; padding: 6px 0; }
    .totals .row.grand { border-top: 2px solid var(--accent); margin-top: 8px; padding-top: 12px;
      font-size: 20px; font-weight: 800; color: var(--accent); }
    .totals .muted { color: var(--muted); }
    .notes { margin-top: 30px; padding: 16px 18px; background: var(--soft); border-radius: 8px; }
    .notes .lbl { font-weight: 700; margin-bottom: 6px; }
    .foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 12px; text-align: center; line-height: 1.7; }
    .valid { display: inline-block; margin-top: 10px; padding: 5px 12px; background: var(--soft);
      border-radius: 999px; font-size: 12px; color: var(--muted); }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; }
      @page { margin: 18mm; }
    }
    @media (max-width: 640px) {
      .sheet { padding: 24px 20px; } .head, .parties { flex-direction: column; }
      .doc-title { text-align: left; } .totals { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button class="btn" onclick="window.location.href='/'">← Dashboard</button>
    <button class="btn primary" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>
  <div class="sheet" id="sheet">Loading…</div>

  <script>
    const cur = { symbol: '₪' };
    function money(n) { return `${cur.symbol}${Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; }
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }

    async function load() {
      const id = location.pathname.split('/').pop();
      const res = await fetch('/api/proposals/' + id);
      if (!res.ok) { document.getElementById('sheet').innerHTML = 'Proposal not found.'; return; }
      const { proposal: p, settings: s } = await res.json();
      cur.symbol = s.currency || '₪';
      document.title = `${p.number} · ${p.companyName || 'Proposal'}`;
      render(p, s);
    }

    function render(p, s) {
      const t = p.totals;
      const validUntil = s.validityDays ? new Date(Date.now() + s.validityDays * 86400000) : null;
      const bizMeta = [s.contactName, s.email, s.phone, s.website].filter(Boolean).map(esc).join(' · ');
      const clientMeta = [p.contactName, p.contactEmail, p.contactPhone].filter(Boolean).map(esc).join('<br>');

      const rows = p.lineItems.map(li => `
        <tr>
          <td>${li.imageUrl ? `<img class="item-img" src="${esc(li.imageUrl)}" onerror="this.style.display='none'">` : ''}</td>
          <td><div class="item-name">${esc(li.name)}</div>${li.description ? `<div class="item-desc">${esc(li.description)}</div>` : ''}</td>
          <td class="num">${li.quantity}</td>
          <td class="num">${money(li.unitPrice)}</td>
          <td class="num">${money(li.lineTotal)}</td>
        </tr>`).join('');

      const extraRows = (p.extras || []).map(e => `
        <tr>
          <td></td><td><div class="item-name">${esc(e.label)}</div></td>
          <td class="num">1</td><td class="num">${money(e.amount)}</td><td class="num">${money(e.amount)}</td>
        </tr>`).join('');

      document.getElementById('sheet').innerHTML = `
        <div class="head">
          <div>
            ${s.logoUrl ? `<img class="logo" src="${esc(s.logoUrl)}" onerror="this.style.display='none'"><br>` : ''}
            <div class="biz-name">${esc(s.businessName || 'Your Company')}</div>
            <div class="biz-meta">${bizMeta}</div>
          </div>
          <div class="doc-title">
            <h1>Proposal</h1>
            <div class="num">${esc(p.number)}</div>
            <div class="num">${fmtDate(p.createdAt)}</div>
          </div>
        </div>

        <div class="parties">
          <div class="box">
            <div class="lbl">Prepared for</div>
            <div class="company">${esc(p.companyName || '—')}</div>
            <div class="sub">${clientMeta}</div>
          </div>
          <div class="box" style="text-align:right">
            <div class="lbl">Proposal</div>
            <div class="company">${esc(p.title)}</div>
          </div>
        </div>

        <table>
          <thead><tr><th></th><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead>
          <tbody>${rows || ''}${extraRows}</tbody>
        </table>

        <div class="totals">
          <div class="row muted"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
          ${t.discountAmount ? `<div class="row muted"><span>Discount</span><span>−${money(t.discountAmount)}</span></div>` : ''}
          ${t.taxRate ? `<div class="row muted"><span>Tax (${t.taxRate}%)</span><span>${money(t.taxAmount)}</span></div>` : ''}
          <div class="row grand"><span>Total</span><span>${money(t.grandTotal)}</span></div>
        </div>

        ${p.notes ? `<div class="notes"><div class="lbl">Notes</div>${esc(p.notes).replace(/\n/g,'<br>')}</div>` : ''}

        <div class="foot">
          ${validUntil ? `<div class="valid">Valid until ${fmtDate(validUntil.toISOString())}</div><br>` : ''}
          ${esc(s.footerNote || '')}
        </div>`;
    }

    load();
  </script>
</body>
</html>
